<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <!-- 背景 -->
  <rect width="960" height="620" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="480" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#263238">指针与地址 · 核心图解</text>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#78909C">变量有地址 · 指针存地址 · *p 顺着地址取值 —— 以 STM32 的 RAM 为例</text>

  <!-- ============ 左面板: 内存 ============ -->
  <rect x="40" y="95" width="400" height="385" rx="12" fill="#FAFAFA" stroke="#E0E0E0"/>
  <text x="60" y="128" font-size="16" font-weight="bold" fill="#455A64">① 内存: 一排有地址的格子</text>

  <!-- 地址标签(右对齐) -->
  <text x="190" y="178" text-anchor="end" font-size="13" font-family="Consolas,monospace" fill="#78909C">0x20000000</text>
  <text x="190" y="234" text-anchor="end" font-size="13" font-family="Consolas,monospace" fill="#78909C">0x20000004</text>
  <text x="190" y="290" text-anchor="end" font-size="13" font-family="Consolas,monospace" fill="#78909C">0x20000008</text>
  <text x="190" y="346" text-anchor="end" font-size="13" font-family="Consolas,monospace" fill="#78909C">0x2000000C</text>

  <!-- 格子: 第1行 空闲 -->
  <rect x="205" y="150" width="110" height="46" fill="#FAFAFA" stroke="#BDBDBD"/>
  <text x="260" y="178" text-anchor="middle" font-size="13" fill="#B0BEC5">未使用</text>

  <!-- 格子: 第2行 变量 a -->
  <rect x="205" y="206" width="110" height="46" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="260" y="234" text-anchor="middle" font-size="14">
    <tspan fill="#1976D2" font-weight="bold">a </tspan><tspan fill="#263238">= 10</tspan>
  </text>

  <!-- 格子: 第3行 空闲 -->
  <rect x="205" y="262" width="110" height="46" fill="#FAFAFA" stroke="#BDBDBD"/>
  <text x="260" y="290" text-anchor="middle" font-size="13" fill="#B0BEC5">未使用</text>

  <!-- 格子: 第4行 指针 p -->
  <rect x="205" y="318" width="110" height="46" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="260" y="346" text-anchor="middle" font-size="13.5" font-family="Consolas,'Microsoft YaHei',monospace">
    <tspan fill="#F57C00" font-weight="bold">p </tspan><tspan fill="#263238">= 0x20000004</tspan>
  </text>

  <!-- 表格下方注释 -->
  <text x="60" y="400" font-size="13" fill="#78909C">地址 = 格子的门牌号, 找到门牌号就能找到格子</text>
  <text x="60" y="428" font-size="13" fill="#F57C00">p 的格子(橙色)里存的是 a 的格子(蓝色)的门牌号</text>

  <!-- 箭头: p 指向 a -->
  <path d="M315,341 H395 V229 H321" fill="none" stroke="#F57C00" stroke-width="2.5"/>
  <polygon points="315,229 327,222 327,236" fill="#F57C00"/>
  <text x="405" y="283" font-size="13" font-weight="bold" fill="#F57C00">p 指向 a</text>
  <text x="405" y="303" font-size="11.5" font-family="Consolas,monospace" fill="#F57C00">p = &amp;a</text>

  <!-- ============ 右面板: C 代码 ============ -->
  <rect x="520" y="95" width="400" height="385" rx="12" fill="#FAFAFA" stroke="#E0E0E0"/>
  <text x="540" y="128" font-size="16" font-weight="bold" fill="#455A64">② C 代码: 声明与含义</text>

  <!-- 代码行 1 -->
  <text x="540" y="168" font-size="15" font-family="Consolas,monospace">
    <tspan fill="#7B1FA2">int </tspan><tspan fill="#1976D2">a </tspan><tspan fill="#263238">= 10;</tspan>
  </text>
  <text x="540" y="190" font-size="13" fill="#90A4AE"><tspan fill="#B0BEC5">// </tspan>把 10 放进变量 a 的格子</text>

  <!-- 代码行 2 -->
  <text x="540" y="220" font-size="15" font-family="Consolas,monospace">
    <tspan fill="#7B1FA2">int </tspan><tspan fill="#F57C00" font-weight="bold">*p </tspan><tspan fill="#263238">= &amp;a;</tspan>
  </text>
  <text x="540" y="242" font-size="13" fill="#90A4AE"><tspan fill="#B0BEC5">// </tspan>p 的格子里存的是 a 的门牌号</text>

  <!-- 代码行 3 -->
  <text x="540" y="272" font-size="15" font-family="Consolas,monospace">
    <tspan fill="#7B1FA2">int </tspan><tspan fill="#1976D2">x </tspan><tspan fill="#263238">= </tspan><tspan fill="#F57C00" font-weight="bold">*p;</tspan>
  </text>
  <text x="540" y="294" font-size="13" fill="#90A4AE"><tspan fill="#B0BEC5">// </tspan>顺着 p 找到 a 的格子, 取出 10 放进 x</text>

  <!-- 关键词速记 -->
  <text x="540" y="326" font-size="14"><tspan fill="#F57C00" font-weight="bold">&amp;a</tspan><tspan font-size="13" fill="#37474F">  = 取 a 的地址, 即 0x20000004</tspan></text>
  <text x="540" y="352" font-size="14"><tspan fill="#F57C00" font-weight="bold">p</tspan><tspan font-size="13" fill="#37474F">    = 存地址的变量, 值是 0x20000004</tspan></text>
  <text x="540" y="378" font-size="14"><tspan fill="#43A047" font-weight="bold">*p</tspan><tspan font-size="13" fill="#37474F">   = 顺着地址取值, 得到 10</tspan></text>

  <!-- 口诀 -->
  <rect x="540" y="398" width="355" height="46" rx="8" fill="#F1F8E9" stroke="#8BC34A" stroke-dasharray="4 3"/>
  <text x="717" y="426" text-anchor="middle" font-size="14" fill="#33691E">口诀: 指针 = 记着门牌号的便签</text>

  <!-- ============ 底部速记卡片 ============ -->
  <rect x="40" y="505" width="280" height="95" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="180" y="533" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">&amp;a → 取地址</text>
  <text x="180" y="560" text-anchor="middle" font-size="13" fill="#37474F">a 的门牌号</text>
  <text x="180" y="582" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#455A64">例如 0x20000004</text>

  <rect x="340" y="505" width="280" height="95" rx="10" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="480" y="533" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">p → 指针变量</text>
  <text x="480" y="560" text-anchor="middle" font-size="13" fill="#37474F">专门存地址的变量</text>
  <text x="480" y="582" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#455A64">p = 0x20000004</text>

  <rect x="640" y="505" width="280" height="95" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="780" y="533" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D32">*p → 解引用</text>
  <text x="780" y="560" text-anchor="middle" font-size="13" fill="#37474F">顺着地址找到格子</text>
  <text x="780" y="582" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" fill="#455A64">取出的值 = 10</text>
</svg>
